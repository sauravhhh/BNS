<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nyaya — Bharatiya Nyaya Sanhita Search</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --border: #e8e8e8;
      --border-strong: #d1d5db;
      --hover: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 48px 20px 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .brand .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      flex-shrink: 0;
    }
    .brand .logo svg { width: 28px; height: 28px; }
    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px 2px;
    }
    #queryInput {
      width: 100%;
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    #queryInput:focus {
      border-color: #111111;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }
    .button-row { display: flex; gap: 10px; }
    #searchBtn {
      flex: 2;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: #111111;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    #searchBtn:hover { background: #2b2b2b; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
    #searchBtn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10); }
    #clearBtn {
      flex: 1;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    #clearBtn:hover { background: var(--hover); border-color: var(--border-strong); transform: translateY(-1px); }
    #clearBtn:active { transform: translateY(0); }
    .hint {
      margin: 12px 2px 0;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint code {
      font-family: inherit;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      color: var(--text);
    }
    #error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      width: 100%;
      max-width: 440px;
      margin: 16px auto 0;
      padding: 12px 16px;
      text-align: center;
    }
    #error:empty { display: none; }
    .result-box {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin: 16px auto 0;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.36s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sec-no {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .sec-title {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .sec-desc {
      font-size: 14.5px;
      line-height: 1.65;
      color: #333333;
      margin: 0 0 6px;
      white-space: pre-wrap;
    }
    .sec-points {
      margin: 10px 0 0;
      padding-left: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #444444;
    }
    .sec-points li { margin-bottom: 6px; }
    .points-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 2px;
    }
    .share-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .share-icon { width: 17px; height: 17px; flex-shrink: 0; }
    .share-btn:hover { background: var(--hover); border-color: var(--border-strong); transform: translateY(-1px); }
    .share-btn:active { transform: translateY(0); }
    .rel-card {
      width: 100%;
      max-width: 440px;
      margin: 10px auto 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .rel-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07); }
    .rel-no { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .rel-title { font-size: 15.5px; font-weight: 600; margin: 3px 0; letter-spacing: -0.01em; line-height: 1.35; }
    .rel-ch { font-size: 12.5px; color: var(--muted); }
    footer {
      margin-top: auto;
      padding: 28px 16px;
      font-size: 12.5px;
      color: var(--muted);
      user-select: none;
      text-align: center;
      width: 100%;
    }
</style>
</head>
<body>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 10v44"/>
        <path d="M16 19h32"/>
        <path d="M21 19l-7 15a8 8 0 0 0 14 0l-7-15z"/>
        <path d="M43 19l-7 15a8 8 0 0 0 14 0l-7-15z"/>
        <path d="M23 54h18"/>
      </svg>
    </span>
    <h1>Nyaya</h1>
  </div>
  <p class="sub">Bharatiya Nyaya Sanhita &middot; section search</p>

  <div class="card">
    <label for="queryInput">Section number</label>
    <input id="queryInput" type="text" placeholder="e.g. 103" autocomplete="off" />
    <div class="button-row">
      <button id="clearBtn" type="button">Clear</button>
      <button id="searchBtn" type="button">Search</button>
    </div>
    <p class="hint">Type a BNS section number from 1 to 358.</p>
  </div>

  <div id="error"></div>
  <div id="results"></div>

  <footer>Made with &hearts; by sauravhhh</footer>

  <script>
    let sections = {};   // "103" -> {title, description, key_points, chapter}
    let dataLoaded = false;

    // Bump DATA_VERSION whenever bns.json changes so browsers fetch the new file
    const DATA_VERSION = "20260929";
    fetch("bns.json?v=" + DATA_VERSION)
      .then((r) => r.json())
      .then((data) => {
        for (const [ck, ch] of Object.entries(data.chapters || {})) {
          const chapterTitle = ch.title || ck;
          for (const [sk, s] of Object.entries(ch.sections_detail || {})) {
            const num = sk.replace("section_", "");
            sections[num] = { ...s, chapter: chapterTitle };
          }
        }
        dataLoaded = true;
      })
      .catch(() => { dataLoaded = false; });

    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const queryInput = document.getElementById("queryInput");
    const results = document.getElementById("results");
    const errorDiv = document.getElementById("error");

    function clearAll() {
      queryInput.value = "";
      results.innerHTML = "";
      errorDiv.textContent = "";
      queryInput.focus();
    }
    clearBtn.onclick = clearAll;

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderSection(num) {
      const s = sections[num];
      const points = (s.key_points || []).filter(Boolean);
      results.innerHTML = `
        <div class="result-box">
          <div class="sec-no">Section ${esc(num)}</div>
          <div class="sec-title">${esc(s.title)}</div>
          <div class="chip-row">
            <span class="chip">${esc(s.chapter)}</span>
          </div>
          <p class="sec-desc">${esc(s.description)}</p>
          ${points.length ? `<div class="points-label">Key points</div><ul class="sec-points">${points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
          <button class="share-btn" id="shareBtn" onclick="shareResult()"><svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg><span id="shareBtnText">Share result</span></button>
        </div>`;
      lastResult = { num, title: s.title, chapter: s.chapter,
                     desc: s.description || "", points };
    }

    let lastResult = null;

    function shareResult() {
      if (!lastResult) return;
      const r = lastResult;
      let text = "Nyaya - BNS Section " + r.num + ": " + r.title;
      text += "\n" + r.desc;
      if (r.points.length) text += "\n" + r.points.map(pt => "- " + pt).join("\n");
      text += "\nhttps://sauravhhh.github.io/Nyaya/";
      if (navigator.share) {
        navigator.share({ title: "Nyaya - Section " + r.num, text: text }).catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          const t = document.getElementById("shareBtnText");
          if (t) { const prev = t.textContent; t.textContent = "Copied to clipboard"; setTimeout(() => t.textContent = prev, 1600); }
        }).catch(() => {});
      }
    }

    function keywordSearch(q) {
      const words = q.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2);
      if (!words.length) { errorDiv.textContent = "Please enter a valid section number."; return; }
      const hits = [];
      for (const num in sections) {
        const s = sections[num];
        const title = (s.title || "").toLowerCase();
        const desc = (s.description || "").toLowerCase();
        const pts = (s.key_points || []).join(" ").toLowerCase();
        const ch = (s.chapter || "").toLowerCase();
        let score = 0, ok = true;
        for (const w of words) {
          let ws = 0;
          if (title.includes(w)) ws += 4;
          if (desc.includes(w)) ws += 2;
          if (pts.includes(w)) ws += 1;
          if (ch.includes(w)) ws += 1;
          if (!ws) { ok = false; break; }
          score += ws;
        }
        if (ok) hits.push({ num, score });
      }
      hits.sort((a, b) => (b.score - a.score) || ((+a.num) - (+b.num)));
      if (!hits.length) { errorDiv.textContent = `No sections found for "${esc(q)}".`; return; }
      results.innerHTML =
        `<div class="points-label">Related sections (${hits.length})</div>` +
        hits.slice(0, 12).map(h => {
          const s = sections[h.num];
          return `<div class="rel-card" onclick="renderSection('${h.num}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')renderSection('${h.num}')">` +
            `<div class="rel-no">Section ${esc(h.num)}</div>` +
            `<div class="rel-title">${esc(s.title)}</div>` +
            `<div class="rel-ch">${esc(s.chapter)}</div></div>`;
        }).join("");
    }

    function searchNyaya() {
      errorDiv.textContent = "";
      results.innerHTML = "";
      const q = queryInput.value.trim();
      if (!q) { errorDiv.textContent = "Please enter a section number."; return; }
      if (!dataLoaded) { errorDiv.textContent = "Database not loaded. Please try again in a moment."; return; }

      const digits = q.match(/\d+/);
      if (digits) {
        const num = String(parseInt(digits[0], 10));
        if (sections[num]) { renderSection(num); return; }
        if (!/[a-zA-Z]/.test(q)) { errorDiv.textContent = `No BNS section found for "${esc(q)}". Sections run from 1 to 358.`; return; }
      }
      keywordSearch(q);
    }

    searchBtn.onclick = searchNyaya;
    queryInput.addEventListener("keyup", (e) => { if (e.key === "Enter") searchNyaya(); });
  </script>
</body>
</html>
