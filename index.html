<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nyaya — Bharatiya Nyaya Sanhita Search</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <style>
    :root {
      --ink: #452715;
      --ink-soft: #6a5121;
      --muted: #8a6f45;
      --gold: #bcaa6b;
      --brass: #7b5932;
      --brass-dark: #5a421a;
      --card: #fff8e4;
      --card-border: #bba76a3b;
      --input-bg: #faf3db;
      --input-border: #ad996864;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(120deg, #f9f5ee 0%, #efe0c5 70%, #d3c1a3 100%);
      color: var(--ink);
      margin: 0;
      padding: 44px 20px 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .brand .logo { display: flex; align-items: center; justify-content: center; }
    .brand .logo svg { width: 40px; height: 40px; }
    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      color: #5b3423;
      text-shadow: 0 1px 8px #f2dfc1;
      line-height: 1.1;
    }
    .sub {
      margin: 2px 0 22px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 3px 16px rgba(107, 92, 45, 0.24);
      padding: 1.6rem 1.3rem 1.3rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 8px 2px;
    }
    #queryInput {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      border: 1.5px solid var(--input-border);
      font-size: 1.1rem;
      font-family: 'Georgia', serif;
      color: #422c14;
      background-color: var(--input-bg);
      letter-spacing: 0.02em;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }
    #queryInput:focus {
      border-color: #947c3a;
      background-color: #fff8db;
      box-shadow: 0 0 0 3px #a6812a33;
    }
    .button-row { display: flex; justify-content: center; gap: 0.8rem; }
    #searchBtn {
      flex: 2;
      max-width: 220px;
      padding: 0.65rem 0;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      background-color: var(--brass);
      color: #fff;
      transition: background-color 0.2s, transform 0.15s;
    }
    #searchBtn:hover { background-color: #6a4c28; transform: translateY(-1px); }
    #searchBtn:active { background-color: var(--brass-dark); transform: translateY(0); }
    #clearBtn {
      flex: 1;
      max-width: 140px;
      padding: 0.65rem 0;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      cursor: pointer;
      background-color: #eddebd;
      color: var(--ink-soft);
      transition: background-color 0.2s, transform 0.15s;
    }
    #clearBtn:hover { background-color: #e2cda0; transform: translateY(-1px); }
    #clearBtn:active { background-color: #beaa71; color: #fff; transform: translateY(0); }
    .hint {
      margin: 0.9rem 2px 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .hint code {
      font-family: 'Georgia', serif;
      background: #f3e8cd;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 0.82rem;
      color: var(--ink);
      white-space: nowrap;
    }
    #error {
      color: #a92828;
      background: #fdeeee;
      border: 1px solid #f3c1c1;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      width: 100%;
      max-width: 480px;
      margin: 16px auto 0;
      padding: 12px 16px;
      text-align: center;
    }
    #error:empty { display: none; }
    .result-box {
      width: 100%;
      max-width: 480px;
      border-left: 5px solid var(--gold);
      background-color: #fffdebcc;
      box-shadow: 2px 2px 7px #bda96144;
      padding: 1.1rem 1.2rem 1rem 1.3rem;
      border-radius: 9px;
      margin: 16px auto 0;
      line-height: 1.48;
      animation: fadeIn 0.36s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sec-no {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .sec-title {
      font-weight: 800;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: #7a5f22;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f6ecd4;
      border: 1px solid var(--input-border);
      color: var(--ink-soft);
    }
    .chip.ipc { background: var(--brass); border-color: var(--brass); color: #fff; }
    .sec-desc {
      font-weight: 400;
      font-size: 0.98rem;
      color: #59492c;
      margin: 0;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .points-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 4px;
    }
    .sec-points {
      margin: 0;
      padding-left: 1.25rem;
      list-style-type: disc;
      color: #6a5131;
      font-size: 0.93rem;
      line-height: 1.55;
    }
    .sec-points li { margin-bottom: 5px; }
    footer {
      margin-top: auto;
      padding: 28px 16px;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      user-select: none;
      text-align: center;
      width: 100%;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.6rem; }
      .card { padding: 1.2rem 1rem 1rem; }
      .sec-title { font-size: 1.08rem; }
      .sec-desc, .sec-points { font-size: 0.9rem; }
    }
</style>
</head>
<body>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="#7b5932" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 10v44"/>
        <path d="M16 19h32"/>
        <path d="M21 19l-7 15a8 8 0 0 0 14 0l-7-15z"/>
        <path d="M43 19l-7 15a8 8 0 0 0 14 0l-7-15z"/>
        <path d="M23 54h18"/>
      </svg>
    </span>
    <h1>Nyaya</h1>
  </div>
  <p class="sub">Bharatiya Nyaya Sanhita &middot; section search</p>

  <div class="card">
    <label for="queryInput">Section number</label>
    <input id="queryInput" type="text" placeholder="e.g. 103" autocomplete="off" />
    <div class="button-row">
      <button id="clearBtn" type="button">Clear</button>
      <button id="searchBtn" type="button">Search</button>
    </div>
    <p class="hint">Type a BNS section number, or an old IPC number like <code>IPC 302</code> to find its BNS equivalent.</p>
  </div>

  <div id="error"></div>
  <div id="results"></div>

  <footer>Made with &hearts; by sauravhhh</footer>

  <script>
    // IPC number -> BNS section, built from the dataset's ipc_equivalent fields
    let ipcToBns = {};

    let sections = {};   // "103" -> {title, description, key_points, chapter}
    let dataLoaded = false;

    // Bump DATA_VERSION whenever bns.json changes so browsers fetch the new file
    const DATA_VERSION = "20260929";
    fetch("bns.json?v=" + DATA_VERSION)
      .then((r) => r.json())
      .then((data) => {
        for (const [ck, ch] of Object.entries(data.chapters || {})) {
          const chapterTitle = ch.title || ck;
          for (const [sk, s] of Object.entries(ch.sections_detail || {})) {
            const num = sk.replace("section_", "");
            sections[num] = { ...s, chapter: chapterTitle };
            if (s.ipc_equivalent) ipcToBns[String(s.ipc_equivalent).toUpperCase()] = num;
          }
        }
        dataLoaded = true;
      })
      .catch(() => { dataLoaded = false; });

    const searchBtn = document.getElementById("searchBtn");
    const clearBtn = document.getElementById("clearBtn");
    const queryInput = document.getElementById("queryInput");
    const results = document.getElementById("results");
    const errorDiv = document.getElementById("error");

    function clearAll() {
      queryInput.value = "";
      results.innerHTML = "";
      errorDiv.textContent = "";
      queryInput.focus();
    }
    clearBtn.onclick = clearAll;

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderSection(num, viaIpc) {
      const s = sections[num];
      const points = (s.key_points || []).filter(Boolean);
      results.innerHTML = `
        <div class="result-box">
          <div class="sec-no">Section ${esc(num)}</div>
          <div class="sec-title">${esc(s.title)}</div>
          <div class="chip-row">
            <span class="chip">${esc(s.chapter)}</span>
            ${viaIpc ? `<span class="chip ipc">IPC ${esc(viaIpc)} &rarr; BNS ${esc(num)}</span>` : ""}
          </div>
          <p class="sec-desc">${esc(s.description)}</p>
          ${points.length ? `<div class="points-label">Key points</div><ul class="sec-points">${points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
        </div>`;
    }

    function searchNyaya() {
      errorDiv.textContent = "";
      results.innerHTML = "";
      const q = queryInput.value.trim();
      if (!q) { errorDiv.textContent = "Please enter a section number."; return; }
      if (!dataLoaded) { errorDiv.textContent = "Database not loaded. Please try again in a moment."; return; }

      const ipcMatch = q.match(/ipc\s*([0-9]+[a-zA-Z]?)/i);
      if (ipcMatch) {
        const ipcNo = ipcMatch[1].toUpperCase();
        const bnsNo = ipcToBns[ipcNo];
        if (bnsNo && sections[bnsNo]) { renderSection(bnsNo, ipcNo); return; }
        errorDiv.textContent = `No BNS equivalent found for IPC ${esc(ipcNo)}. Try a BNS section number instead.`;
        return;
      }

      const digits = q.match(/\d+/);
      if (!digits) { errorDiv.textContent = "Please enter a valid section number."; return; }
      const num = String(parseInt(digits[0], 10));
      if (sections[num]) { renderSection(num, null); return; }
      errorDiv.textContent = `No BNS section found for "${esc(q)}". Sections run from 1 to 358.`;
    }

    searchBtn.onclick = searchNyaya;
    queryInput.addEventListener("keyup", (e) => { if (e.key === "Enter") searchNyaya(); });
  </script>
</body>
</html>
